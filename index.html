(() => {
  'use strict';

  if (window.tscCalendarPushUiV1) return;
  window.tscCalendarPushUiV1 = true;

  const PUSH_ENDPOINT = 'https://ohmofthdkjkttdyjuxwv.supabase.co/functions/v1/calendar-push';
  const TOKEN_KEY = 'calendarPushToken';
  const PAUSE_KEY = 'calendarNotificationsPaused';

  let pendingNotice = null;
  let noticeTimer = null;

  function noticeIdFromUrl(value) {
    try {
      const u = new URL(value, location.href);
      if (u.origin !== location.origin) return null;
      return u.searchParams.get('avviso');
    } catch {
      return null;
    }
  }

  function cleanNoticeUrl() {
    const u = new URL(location.href);
    if (u.searchParams.has('avviso')) {
      u.searchParams.delete('avviso');
      history.replaceState(history.state, '', u.pathname + u.search + u.hash);
    }
  }

  function requestNotice(id) {
    if (!id) return;
    cleanNoticeUrl();
    clearTimeout(noticeTimer);
    pendingNotice = { id: String(id), deadline: Date.now() + 20000 };
    tryOpenNotice();
  }

  function tryOpenNotice() {
    if (!pendingNotice) return;

    if (typeof remoteReady === 'undefined' || !remoteReady) {
      if (Date.now() < pendingNotice.deadline) {
        noticeTimer = setTimeout(tryOpenNotice, 300);
        return;
      }
      pendingNotice = null;
      if (typeof toast === 'function') toast('Avviso non aperto: sincronizzazione online non completata.');
      return;
    }

    if (document.querySelector('#modal.show form')) {
      pendingNotice = null;
      if (typeof toast === 'function') toast('Salva o chiudi il modulo e apri l’avviso dalla bacheca.');
      return;
    }

    const id = pendingNotice.id;
    pendingNotice = null;

    const notes = Array.isArray(db.generalNotes) ? db.generalNotes : [];
    const notice = notes.find(item => String(item.id) === id);

    if (!notice) {
      if (typeof toast === 'function') toast('L’avviso non è più disponibile.');
      return;
    }

    modal(
      notice.title || 'Avviso',
      '<p class="note">' + esc(notice.date || '') + '</p>' +
      '<div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6">' +
      esc(notice.text || '') +
      '</div>' +
      '<div class="actions"><button type="button" class="close">Chiudi</button></div>'
    );
  }

  async function getPushSubscription() {
    if (!('serviceWorker' in navigator)) return null;
    const registration = await navigator.serviceWorker.ready;
    return await registration.pushManager.getSubscription();
  }

  async function changeNotificationSubscription(action) {
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) return false;

    const subscription = await getPushSubscription();
    if (!subscription) return false;

    const response = await fetch(PUSH_ENDPOINT + '?action=' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token,
        subscription: {
          endpoint: subscription.endpoint,
          keys: subscription.toJSON().keys
        }
      })
    });

    return response.ok;
  }

  function updatePauseButton() {
    const button = document.getElementById('notificationPauseButton');
    if (!button) return;

    const paused = localStorage.getItem(PAUSE_KEY) === '1';
    button.textContent = paused ? 'Riattiva notifiche' : 'Sospendi notifiche';
    button.setAttribute('aria-pressed', paused ? 'true' : 'false');
  }

  async function toggleNotifications() {
    const button = document.getElementById('notificationPauseButton');
    if (!button) return;

    const paused = localStorage.getItem(PAUSE_KEY) === '1';
    button.disabled = true;

    try {
      const ok = await changeNotificationSubscription(paused ? 'subscribe' : 'unsubscribe');

      if (!ok) {
        if (typeof toast === 'function') toast('Impossibile cambiare le notifiche.');
        return;
      }

      localStorage.setItem(PAUSE_KEY, paused ? '0' : '1');
      updatePauseButton();

      if (typeof toast === 'function') {
        toast(paused ? 'Notifiche riattivate.' : 'Notifiche sospese.');
      }
    } catch {
      if (typeof toast === 'function') toast('Errore durante il cambio delle notifiche.');
    } finally {
      button.disabled = false;
    }
  }

  function addPauseButton() {
    if (document.getElementById('notificationPauseButton')) return;

    const container = document.createElement('div');
    container.style.cssText = 'display:flex;justify-content:center;padding:10px;';

    const button = document.createElement('button');
    button.id = 'notificationPauseButton';
    button.type = 'button';
    button.className = 'secondary';
    button.addEventListener('click', toggleNotifications);

    container.appendChild(button);
    document.body.appendChild(container);

    updatePauseButton();
  }

  function start() {
    const initialNoticeId = noticeIdFromUrl(location.href);
    const navigation = performance.getEntriesByType('navigation')[0];
    cleanNoticeUrl();

    if (initialNoticeId && navigation?.type !== 'reload') {
      requestNotice(initialNoticeId);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', event => {
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        const noticeId = noticeIdFromUrl(data.url || data.href || data.data?.url || '');
        if (noticeId) requestNotice(noticeId);
      });
    }

    window.addEventListener('popstate', () => {
      requestNotice(noticeIdFromUrl(location.href));
    });

    addPauseButton();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
